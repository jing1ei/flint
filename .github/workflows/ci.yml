name: CI

# Linux checks need no sidecars. The macOS shell job builds Tauri and needs dist/
# plus the ffmpeg/ffprobe binaries declared by externalBin.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release-contracts:
    name: release version and tag regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/test_release_workflow.py
      - run: bash -n scripts/prepare_release_tag.sh

  # convert-core is platform-free and dependency-light: this is the job that runs on every push.
  core:
    name: core crate (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p convert-core --all-targets -- -D warnings
      - run: cargo test -p convert-core
      # Reject drift in the committed format reference.
      - run: cargo run -q -p convert-core --bin format-report FORMATS.md
      - name: FORMATS.md is up to date
        run: git diff --exit-code -- FORMATS.md

  frontend:
    name: frontend (tsc, build, generated catalog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Regenerate the mock catalog from the core format definitions and reject drift.
      - run: npm run gen:catalog
      - name: src/lib/mock-catalog.ts is up to date
        run: git diff --exit-code -- src/lib/mock-catalog.ts

  ui:
    name: UI behaviour (mock backend) and dead-CSS probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install playwright && python -m playwright install --with-deps chromium webkit
      - name: start the dev server (mock backend, no Rust, no FFmpeg)
        run: |
          nohup npm run dev > /tmp/vite-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:1420/ > /dev/null && exit 0
            sleep 1
          done
          echo "dev server did not come up on 127.0.0.1:1420" >&2
          exit 1
      - run: python3 scripts/ui_behaviour.py
      - run: python3 scripts/ui_skin.py
      - run: python3 scripts/ui_crop.py
      - run: python3 scripts/ui_crop.py --browser webkit
      - run: python3 scripts/ui_music.py
      - run: python3 scripts/ui_midi.py
      - run: python3 scripts/ui_theme.py
      - run: python3 scripts/ui_experience.py
      - run: python3 scripts/ui_experience.py --browser webkit
      - run: python3 scripts/ui_legacy.py
      - run: python3 scripts/test_macos_compat.py
      - run: python3 scripts/deadcss.py

  # macOS runs the full shell suite; windows.yml runs the native Windows checks. Both need sidecars
  # `externalBin` declares before it will even compile.
  shell:
    name: Tauri shell (workspace clippy, workspace tests)
    runs-on: macos-15  # arm64; macos-14 is unsupported after November 2026 and release.yml already builds on 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # produces dist/, which tauri.conf.json's frontendDist points at
      - run: python3 scripts/test_sidecar_download.py
      - run: ./scripts/fetch-sidecars.sh
      - run: ./scripts/fetch-sidecars.sh --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && python -m playwright install webkit
      - name: Crop menu in macOS WebKit
        run: |
          npm run dev > /tmp/vite-webkit.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:1420/ > /dev/null; then
              python3 scripts/ui_crop.py --browser webkit
              exit $?
            fi
            sleep 1
          done
          cat /tmp/vite-webkit.log >&2
          exit 1
